
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OVRİN AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101116;
  color: white;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

.sidebar {
  width: 260px;
  background: #171922;
  padding: 20px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid #292c38;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  margin-bottom: 30px;
  letter-spacing: 1px;
}

.logo span { color: #8b83ff; }

.new-chat {
  background: #282b39;
  border: 1px solid #41445a;
  color: white;
  padding: 13px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
}

.new-chat:hover { background: #383b4c; }

.sidebar-title {
  color: #898b9a;
  font-size: 12px;
  margin-top: 30px;
}

.history {
  margin-top: 12px;
  overflow-y: auto;
  flex: 1;
}

.history-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  box-sizing: border-box;
  padding: 11px;
  border-radius: 8px;
  color: #c5c6d0;
  cursor: pointer;
  font-size: 13px;
  margin-bottom: 5px;
  overflow: hidden;
}

.history-item span {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.history-item button {
  flex-shrink: 0;
  min-width: 26px;
  width: 26px;
  height: 26px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: #ffffff;
  font-size: 20px;
  cursor: pointer;
}

.history-item button:hover {
  background: #e74c3c;
}

.history-item:hover { background: #282b39; }

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.topbar {
  height: 65px;
  border-bottom: 1px solid #292c38;
  display: flex;
  align-items: center;
  padding: 0 25px;
  font-size: 14px;
}

.status {
  margin-left: auto;
  color: #70d9a2;
  font-size: 12px;
}

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 30px 15px;
}

.welcome {
  text-align: center;
  margin: 12vh auto 35px;
}

.welcome h1 {
  font-size: 34px;
  margin-bottom: 10px;
}

.welcome h1 span { color: #9188ff; }

.welcome p {
  color: #999baa;
  font-size: 14px;
}

.messages {
  max-width: 760px;
  margin: auto;
}

.message {
  padding: 17px;
  margin: 15px 0;
  border-radius: 13px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 14px;
}

.user {
  background: #292c3b;
  margin-left: auto;
  max-width: 85%;
  width: fit-content;
}

.assistant {
  background: #1b1e29;
  border: 1px solid #303343;
}

.input-area {
  padding: 15px 20px 25px;
  width: 100%;
  max-width: 820px;
  margin: auto;
}

.input-box {
  display: flex;
  background: #20232f;
  border: 1px solid #41445a;
  border-radius: 15px;
  padding: 8px;
  gap: 8px;
}

.input-box textarea {
  flex: 1;
  resize: none;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  padding: 12px;
  font-size: 14px;
  min-height: 44px;
  max-height: 130px;
  font-family: inherit;
}

.send {
  background: #766cf5;
  color: white;
  border: none;
  border-radius: 10px;
  width: 48px;
  cursor: pointer;
  font-size: 20px;
}

.send:hover { background: #6559e7; }

.disclaimer {
  color: #777b8b;
  font-size: 11px;
  text-align: center;
  margin-top: 12px;
}

@media(max-width:650px) {
  .sidebar { display: none; }
  .topbar { padding: 0 15px; }
  .welcome h1 { font-size: 27px; }
  .chat { padding: 15px 10px; }
  .input-area { padding: 10px; }
}.
typing {
  display: flex;
  align-items: center;
  gap: 6px;
  width: fit-content;
  min-width: 150px;
}

.typing span {
  width: 7px;
  height: 7px;
  background: #9b8cff;
  border-radius: 50%;
  animation: typingBounce 1.2s infinite ease-in-out;
}

.typing span:nth-child(2) {
  animation-delay: 0.2s;
}

.typing span:nth-child(3) {
  animation-delay: 0.4s;
}

.typing small {
  color: #aaa;
  margin-left: 5px;
  font-size: 12px;
}

@keyframes typingBounce {
  0%, 60%, 100% {
    transform: translateY(0);
    opacity: 0.4;
  }
  30% {
    transform: translateY(-6px);
    opacity: 1;
  }
}
.copy-button {
  margin: 5px 0 12px 8px;
  padding: 5px 10px;
  border: 1px solid #34364a;
  border-radius: 7px;
  background: transparent;
  color: #a9aabe;
  font-size: 11px;
  cursor: pointer;
}

.copy-button:hover {
  background: #292b3d;
  color: white;
}
</style>
</head>

<body>

<aside class="sidebar">
  <div class="logo">OVRİN <span>AI</span></div>

  <button class="new-chat" onclick="newChat()">
    + Yeni sohbet
  </button>

  <div class="sidebar-title">SOHBET GEÇMİŞİ</div>
  <div class="history" id="history"></div>

  <div style="font-size:12px;color:#777b8b">
    OVRİN AI · İlk sürüm
  </div>
</aside>

<main class="main">
  <header class="topbar">
    OVRİN AI
    <span class="status">● Arayüz hazır</span>
  </header>

  <section class="chat" id="chat">
    <div class="welcome" id="welcome">
      <h1>Merhaba, <span>nasıl yardımcı olabilirim?</span></h1>
      <p>OVRİN AI ile yeni şeyler keşfetmeye başla.</p>
    </div>

    <div class="messages" id="messages"></div>
  </section>

  <footer class="input-area">
    <div class="input-box">
      <textarea id="prompt"
        placeholder="OVRİN AI'ye bir şey sor..."
        rows="1"></textarea>
      <button class="send" onclick="sendMessage()">↑</button>
    </div>
    <div class="disclaimer">
      OVRİN AI henüz geliştirme aşamasındadır.
    </div>
  </footer>
</main>

<script>
let conversations = JSON.parse(
  localStorage.getItem("ovrin_chats") || "[]"
);

let currentId = null;
let isTyping = false;

function save() {
  localStorage.setItem(
    "ovrin_chats",
    JSON.stringify(conversations)
  );
}

function newChat() {
  currentId = null;

  document.getElementById("messages").innerHTML = "";
  document.getElementById("welcome").style.display = "block";

  const input = document.getElementById("prompt");
  input.value = "";

  renderHistory();

  input.focus();
}


async function sendMessage() {
  const input = document.getElementById("prompt");
  const value = input.value.trim();

  if (!value || isTyping) return;

  if (!currentId) {
    currentId = Date.now();
    conversations.unshift({
      id: currentId,
      title: value.slice(0, 35),
      messages: []
    });
  }

  const conversation = conversations.find(
    item => item.id === currentId
  );

  const history = conversation.messages.map(message => ({
    role: message.role,
    text: message.text
  }));

  conversation.messages.push({
    role: "user",
    text: value
  });

  input.value = "";

  // Animasyonu başlat
  isTyping = true;

  save();
  renderMessages();
  renderHistory();

  try {
    const response = await fetch(
      "https://ovrin-ai-api.tersaf90.workers.dev/chat",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: value,
          history: history
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.details || data.error || "Bağlantı hatası");
    }

    conversation.messages.push({
      role: "assistant",
      text: data.reply
    });

  } catch (error) {
    conversation.messages.push({
      role: "assistant",
      text: "Üzgünüm, şu anda yapay zekâ bağlantısında sorun var: " + error.message
    });

  } finally {
    // Animasyonu durdur
    isTyping = false;

}

  save();
  renderMessages();
  renderHistory();
}


function renderMessages() {
  const area = document.getElementById("messages");

  const conversation = conversations.find(
    item => item.id === currentId
  );

  area.innerHTML = "";

  if (!conversation) return;

  document.getElementById("welcome").style.display = "none";

  conversation.messages.forEach((message, index) => {
    const wrapper = document.createElement("div");
    const div = document.createElement("div");

    div.className = "message " +
      (message.role === "user" ? "user" : "assistant");

    div.textContent = message.text;
    wrapper.appendChild(div);

    if (message.role === "assistant") {
      const copyButton = document.createElement("button");
      copyButton.className = "copy-button";
      copyButton.textContent = "📋 Kopyala";

      copyButton.onclick = async () => {
        try {
          await navigator.clipboard.writeText(message.text);
          copyButton.textContent = "✓ Kopyalandı";

          setTimeout(() => {
            copyButton.textContent = "📋 Kopyala";
          }, 2000);
        } catch (error) {
          copyButton.textContent = "Kopyalanamadı";
        }
      };

      wrapper.appendChild(copyButton);

      const regenerateButton = document.createElement("button");
      regenerateButton.className = "copy-button";
      regenerateButton.textContent = "↻ Yeniden oluştur";
      regenerateButton.disabled = isTyping;

      regenerateButton.onclick = () => {
        regenerateMessage(index);
      };

      wrapper.appendChild(regenerateButton);
    }

    area.appendChild(wrapper);
  });

  if (isTyping) {
    const typing = document.createElement("div");
    typing.className = "message assistant typing";

    typing.innerHTML = `
      <span></span>
      <span></span>
      <span></span>
      <small>OVRİN AI düşünüyor...</small>
    `;

    area.appendChild(typing);
  }

  document.getElementById("chat").scrollTop =
    document.getElementById("chat").scrollHeight;
}

async function regenerateMessage(messageIndex) {
  if (isTyping) return;

  const conversation = conversations.find(
    item => item.id === currentId
  );

  if (!conversation) return;

  // Önceki kullanıcı mesajını bul
  let userIndex = messageIndex - 1;

  while (
    userIndex >= 0 &&
    conversation.messages[userIndex].role !== "user"
  ) {
    userIndex--;
  }

  if (userIndex < 0) return;

  const userMessage = conversation.messages[userIndex].text;

  const history = conversation.messages
    .slice(0, userIndex)
    .map(message => ({
      role: message.role,
      text: message.text
    }));

  isTyping = true;
  renderMessages();

  try {
    const response = await fetch(
      "https://ovrin-ai-api.tersaf90.workers.dev/chat",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: userMessage,
          history: history
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.details || data.error || "Bağlantı hatası");
    }

    conversation.messages[messageIndex].text = data.reply;

  } catch (error) {
    alert("Yeni cevap oluşturulamadı: " + error.message);

  } finally {
    isTyping = false;
    save();
    renderMessages();
    renderHistory();
  }
}

function renderHistory() {
  const area = document.getElementById("history");
  area.innerHTML = "";

  conversations.forEach(item => {
    const div = document.createElement("div");
    div.className = "history-item";

    if (item.id === currentId) {
      div.classList.add("active");
    }

    const title = document.createElement("span");
    title.textContent = item.title;
    title.style.flex = "1";
    title.style.cursor = "pointer";
    title.onclick = () => {
      currentId = item.id;
      renderMessages();
      renderHistory();
    };

    const deleteButton = document.createElement("button");
    deleteButton.textContent = "×";
    deleteButton.title = "Sohbeti sil";
    deleteButton.style.cursor = "pointer";

    deleteButton.onclick = (event) => {
      event.stopPropagation();

      if (!confirm("Bu sohbeti silmek istiyor musun?")) return;

      conversations = conversations.filter(
        chat => chat.id !== item.id
      );

      if (currentId === item.id) {
        currentId = conversations.length
          ? conversations[0].id
          : null;
      }

      save();
      renderMessages();
      renderHistory();
    };

    div.style.display = "flex";
    div.style.alignItems = "center";
    div.style.gap = "8px";

    div.appendChild(title);
    div.appendChild(deleteButton);
    area.appendChild(div);
  });
}


document.getElementById("prompt").addEventListener(
  "keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  }
);

renderHistory();
</script>

</body>
</html>
